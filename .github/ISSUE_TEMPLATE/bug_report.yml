name: Bug report
description: Report a reproducible problem in agentbrief.
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Include a minimal command and expected vs actual output. Remove secrets first.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.0
    validations:
      required: true
