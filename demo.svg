<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">agentbrief local-first handoff flow</title>
  <desc id="desc">A Git worktree, a failing log, and a goal become a redacted Markdown handoff brief.</desc>
  <defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#0b1220"/><stop offset="1" stop-color="#111827"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity=".28"/></filter></defs>
  <rect width="1200" height="620" rx="28" fill="url(#bg)"/>
  <text x="70" y="80" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700">agentbrief</text>
  <text x="70" y="116" fill="#94a3b8" font-family="Inter,Arial,sans-serif" font-size="18">one safe handoff from the work you already have</text>
  <g filter="url(#shadow)">
    <rect x="70" y="180" width="290" height="270" rx="18" fill="#172033" stroke="#334155"/>
    <rect x="455" y="180" width="290" height="270" rx="18" fill="#172033" stroke="#334155"/>
    <rect x="840" y="145" width="290" height="340" rx="18" fill="#0f2b2b" stroke="#2dd4bf" stroke-width="2"/>
  </g>
  <text x="100" y="225" fill="#38bdf8" font-family="monospace" font-size="16">INPUTS</text>
  <text x="100" y="270" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="600">Git worktree</text>
  <text x="100" y="310" fill="#cbd5e1" font-family="monospace" font-size="16">branch: fix/upload</text>
  <text x="100" y="340" fill="#cbd5e1" font-family="monospace" font-size="16">3 changed files</text>
  <text x="100" y="370" fill="#cbd5e1" font-family="monospace" font-size="16">diff + failing test</text>
  <text x="485" y="225" fill="#fbbf24" font-family="monospace" font-size="16">CONTEXT</text>
  <text x="485" y="270" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="600">Goal + evidence</text>
  <text x="485" y="310" fill="#cbd5e1" font-family="monospace" font-size="16">npm test -- upload</text>
  <text x="485" y="340" fill="#cbd5e1" font-family="monospace" font-size="16">token=••••••••</text>
  <text x="485" y="370" fill="#cbd5e1" font-family="monospace" font-size="16">bounded to 160 lines</text>
  <text x="870" y="195" fill="#5eead4" font-family="monospace" font-size="16">OUTPUT</text>
  <text x="870" y="245" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="600">AGENT_BRIEF.md</text>
  <text x="870" y="292" fill="#ccfbf1" font-family="monospace" font-size="16">## Goal</text>
  <text x="870" y="325" fill="#ccfbf1" font-family="monospace" font-size="16">## Changed files</text>
  <text x="870" y="358" fill="#ccfbf1" font-family="monospace" font-size="16">## Evidence</text>
  <text x="870" y="391" fill="#ccfbf1" font-family="monospace" font-size="16">## Patch context</text>
  <text x="870" y="442" fill="#5eead4" font-family="Inter,Arial,sans-serif" font-size="15">local • redacted • portable</text>
  <path d="M375 315h55m-14-10 14 10-14 10M760 315h55m-14-10 14 10-14 10" fill="none" stroke="#64748b" stroke-width="3"/>
  <text x="70" y="555" fill="#64748b" font-family="monospace" font-size="15">no API key • no upload • no dependencies</text>
</svg>
